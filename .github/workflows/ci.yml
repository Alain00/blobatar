name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick follow-up commit makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            xcode-version: "16.0"
            build-ios: false
          - name: current
            xcode-version: latest-stable
            build-ios: true
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Format
        run: >-
          swift format lint --strict --recursive
          Package.swift
          packages/swift/Sources
          packages/swift/Tests
          packages/swift/Tests/Consumer/Package.swift
          packages/swift/Examples/BlobatarStudio/Package.swift
          packages/swift/Examples/BlobatarStudio/Sources
          packages/swift/Examples/BlobatarStudio/Tests

      - name: Build package and tests
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test package
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build DocC documentation
        if: matrix.name == 'current'
        run: |
          xcodebuild -scheme BlobatarCore -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/blobatar-core-docc" OTHER_DOCC_FLAGS='--warnings-as-errors' docbuild
          xcodebuild -scheme BlobatarSwiftUI -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/blobatar-swiftui-docc" OTHER_DOCC_FLAGS='--warnings-as-errors' docbuild

      - name: Resolve clean consumer through root manifest
        run: |
          swift package --package-path packages/swift/Tests/Consumer resolve
          swift run --package-path packages/swift/Tests/Consumer BlobatarConsumerSmoke

      - name: Build and test Blobatar Studio
        run: >-
          swift test
          --package-path packages/swift/Examples/BlobatarStudio
          -Xswiftc -warnings-as-errors

      - name: Build Blobatar Studio for macOS
        run: >-
          xcodebuild
          -project packages/swift/Examples/BlobatarStudio/BlobatarStudio.xcodeproj
          -scheme BlobatarStudio
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      # Older Xcodes remain useful language/package floors after GitHub removes
      # their matching iOS platform files from hosted images. The current SDK
      # owns the deployment-target build; both matrix legs still compile and
      # test both package products above.
      - name: Build SwiftUI product for iOS
        if: matrix.build-ios
        run: >-
          xcodebuild
          -scheme BlobatarSwiftUI
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build Blobatar Studio for iOS
        if: matrix.build-ios
        run: >-
          xcodebuild
          -project packages/swift/Examples/BlobatarStudio/BlobatarStudio.xcodeproj
          -scheme BlobatarStudio
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
  flutter:
    name: flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: [3.27.4, 3.x]
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Resolve Flutter package
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Pure Dart tests
        run: dart test test/dart

      - name: Flutter tests
        run: flutter test test/flutter

      - name: API documentation
        run: dart doc --output /tmp/blobatar-docs

      - name: Resolve example
        working-directory: packages/flutter/example
        run: flutter pub get

      - name: Analyze example
        working-directory: packages/flutter/example
        run: flutter analyze

      - name: Test example
        working-directory: packages/flutter/example
        run: flutter test

      - name: Validate publish contents
        if: matrix.flutter-version == '3.x'
        run: dart pub publish --dry-run

  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The smoke test runs under Node on purpose — see scripts/smoke.mjs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Through turbo rather than calling `tsc` directly, so this and
      # `bun run typecheck` in the package are the same command. The package
      # script is still the only place the `tsc` invocation is written down —
      # a local gate that is a subset of CI is a gate that goes green on code
      # CI rejects.
      - name: Typecheck
        run: bunx turbo run typecheck --filter=blobatar

      - name: Tests
        run: bunx turbo run test --filter=blobatar

      # The cross-adapter equivalence check lives in its own private package
      # because no single adapter can own it. It imports each adapter by
      # package name, so this builds them and resolves through their real
      # `exports` maps — the run that caught `@blobatar/react` shipping
      # `export{a as Blobatar}` with no `a`.
      - name: Adapter drift harness
        run: bunx turbo run test --filter=@blobatar/harness

      # Both gates, and they measure different things — core's reads its own
      # source, the harness's resolves every package by name through its built
      # `exports` map. Unfiltered rather than named, so an adapter added in
      # PR 5 is measured the moment its package has a `size` script.
      - name: Size budgets
        run: bunx turbo run size

      # `probe-compose.ts` warns and exits 0 when it finds no browser, so that a
      # local run without one is not a hard stop. In CI that would turn the only
      # check that can see a CSS-versus-geometry divergence into a silent pass,
      # so both engines are asserted present before it runs.
      - name: Assert both engines are on the runner
        run: |
          google-chrome --version
          firefox --version

      # `--filter=blobatar`, because that is where `scripts/probe-compose.ts`
      # lives. Filtered to the harness by the split, where there is no `probe`
      # script — turbo runs zero tasks and exits 0, so the one check that can
      # see a CSS-versus-geometry divergence has been silently passing since.
      - name: Composition gate
        run: bunx turbo run probe --filter=blobatar

      - name: Build
        run: bunx turbo run build

      # Links the built package under Node, through its own `exports` map. This
      # is the step that catches a dist that is broken for everyone outside Bun.
      - name: Smoke the built package
        run: bunx turbo run smoke --filter=blobatar

      # The other publishable: tests, bin build, and a smoke that spawns the
      # built bin under Node against the real library and both generations.
      - name: CLI checks
        run: bun --filter @blobatar/cli check

      # Every publishable package, not just core — a broken `files` or
      # `exports` in an adapter should fail here rather than at publish. A new
      # adapter with no line here is a package whose tarball nothing has ever
      # opened, which for `@blobatar/svelte` is the whole artifact: it ships
      # source, so `files` is the only thing deciding what a consumer receives
      # and there is no build step that would have noticed a gap (ADR-0010).
      - name: Pack
        run: |
          npm pack --workspace blobatar --pack-destination /tmp
          npm pack --workspace @blobatar/react --pack-destination /tmp
          npm pack --workspace @blobatar/vue --pack-destination /tmp
          npm pack --workspace @blobatar/svelte --pack-destination /tmp
          npm pack --workspace @blobatar/solid --pack-destination /tmp
          npm pack --workspace @blobatar/preact --pack-destination /tmp
          npm pack --workspace blobatar-codemod --pack-destination /tmp
          npm pack --workspace @blobatar/cli --pack-destination /tmp

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: /tmp/*blobatar*.tgz
          retention-days: 7

  apps:
    name: apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The apps resolve `blobatar/*` to source through tsconfig paths, so this
      # builds the library from source as a side effect — which is the point: it
      # is the check that an alias and the package's `exports` have not drifted
      # apart into two different libraries.
      - name: Build the site
        run: bun run build:site

      # `apps/api` is the exception to the alias above: it has no `blobatar/*`
      # paths, so anything reaching it resolves the library through `exports`
      # and needs a dist first. That is deliberate — it is the endpoint anyone
      # can deploy, and it should be tested against what they will install.
      #
      # It is built here rather than in the endpoint step because the site's
      # Worker imports the endpoint from `apps/api/src`, so the site's tests
      # cross into that unaliased resolution too.
      - name: Build the library
        run: bunx turbo run build --filter=blobatar

      - name: Site tests
        run: bunx turbo run test --filter=site

      - name: Endpoint tests, against the built package
        run: bunx turbo run test --filter=blobatar-api

      # Bundles `blobatar` the way a deploy does: through the workspace symlink
      # and therefore through the real `exports` map, not the tsconfig alias to
      # source that `build:site` above uses. Breaking an export path fails here
      # rather than in production.
      #
      # It also proves the asset directory exists and the routes parse, which is
      # everything about the deploy that can be checked without performing one.
      - name: Workers bundle against the published exports
        run: |
          cd apps/site && bunx wrangler deploy --dry-run --outdir /tmp/site-dry
          cd ../api && bunx wrangler deploy --dry-run --outdir /tmp/api-dry

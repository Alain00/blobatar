[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blobatar"
version = "2.0.0"
description = "Python port of blobatar — deterministic avatars, byte-identical to the upstream TypeScript"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
keywords = ["avatar", "svg", "identity", "seeded", "generative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.optional-dependencies]
flask = ["flask>=2.0"]
dev = ["pytest>=7.0", "flask>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["blobatar"]
